general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot
    color = rgba(40, 40, 40, 1.0)
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.95
    brightness = 0.80
    vibrancy = 0.12
    vibrancy_darkness = 0.05
}

shape {
    monitor =
    size = 420, 320
    color = rgba(40, 40, 40, 0.72)
    rounding = 18
    border_size = 2
    border_color = rgba(184, 187, 38, 0.95)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(251, 241, 199, 1.0)
    font_size = 64
    font_family = Cascadia Mono
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(213, 196, 161, 1.0)
    font_size = 18
    font_family = Noto Sans
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,BG]
    color = rgba(131, 165, 152, 1.0)
    font_size = 13
    font_family = Noto Sans
    position = 0, -22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(184, 187, 38, 1.0)
    inner_color = rgba(60, 56, 54, 0.92)
    font_color = rgba(235, 219, 178, 1.0)
    fade_on_empty = false
    placeholder_text = password
    hide_input = false
    rounding = 12
    check_color = rgba(131, 165, 152, 1.0)
    fail_color = rgba(251, 73, 52, 1.0)
    fail_text = $FAIL
    capslock_color = rgba(250, 189, 47, 1.0)
    numlock_color = rgba(131, 165, 152, 1.0)
    bothlock_color = rgba(250, 189, 47, 1.0)
    position = 0, -78
    halign = center
    valign = center
}
